client_id = "988fd39a11f95f631b7dbf50308941d4"
name = "snapmint-widget"
application_url = "https://p2q5vzlw-5173.inc1.devtunnels.ms/admin"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "https://p2q5vzlw-5000.inc1.devtunnels.ms/api/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "https://p2q5vzlw-5000.inc1.devtunnels.ms/api/webhooks/discounts/update"
  topics = [ "discounts/update" ]

  [[webhooks.subscriptions]]
  uri = "https://p2q5vzlw-5000.inc1.devtunnels.ms/api/webhooks/shop/update"
  topics = [ "shop/update" ]

  [[webhooks.subscriptions]]
  uri = "https://p2q5vzlw-5000.inc1.devtunnels.ms/api/webhooks/discounts/create"
  topics = [ "discounts/create" ]

  [[webhooks.subscriptions]]
  uri = "https://p2q5vzlw-5000.inc1.devtunnels.ms/api/webhooks/discounts/delete"
  topics = [ "discounts/delete" ]

[access.admin]
direct_api_mode = "offline"
embedded_app_direct_api_access = false

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_discounts,write_discounts,write_products"
